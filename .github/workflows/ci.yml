# Format, lint and test on every push and pull request; release.yml calls it
# on every tag and publishes nothing unless it passes. Tests that need
# downloaded model packages are #[ignore]d, so this runs with no models.
# Linux covers the library, CLI and C ABI; macOS also covers Studio.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: -p local-tts-core -p local-tts-speak -p local-tts-ffi -p local-tts-cli
          - os: macos-latest
            packages: --workspace
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked ${{ matrix.packages }} --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked ${{ matrix.packages }} --no-fail-fast
