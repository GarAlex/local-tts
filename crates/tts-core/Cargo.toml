[package]
name = "local-tts-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Offline text-to-speech in native Rust: Kokoro, VITS, Piper, Vosk, Chatterbox and compact backends with pinned, verified model packages"

[dependencies]
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
ndarray = "0.16"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
rand = "0.9"
rustfst = "1.3"
flate2 = "1"
ureq = { version = "2", optional = true }
zip = { version = "2", default-features = false, optional = true }

[features]
# Native installer for the pinned voice packages (`catalog`): HTTPS via ureq.
download = ["dep:ureq", "dep:zip"]

[build-dependencies]
cc = "1.5.1"
